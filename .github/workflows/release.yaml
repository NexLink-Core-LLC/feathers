name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: feathers
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: feathers/go.mod

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" so the daemon reports e.g. "1.13.1-feathers.1"
          # (it is displayed with its own "v" prefix by the CLI and the Panel).
          VERSION="${REF_NAME#v}"
          GOOS=windows GOARCH=amd64 go build -o dist/winwings_windows_amd64.exe -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${VERSION}" github.com/pterodactyl/wings

      - name: Extract release notes from changelog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          sed -n "/^## ${REF_NAME}$/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG
          if ! [ -s ./RELEASE_CHANGELOG ]; then
            echo "No CHANGELOG.md section found for ${REF_NAME}; add one before tagging." >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: feathers/RELEASE_CHANGELOG
          files: |
            feathers/dist/*
